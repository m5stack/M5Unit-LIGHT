name: Build(platformio)

on:
  push:
    tags-ignore:
      - '*.*.*'
      - 'v*.*.*'
    branches:
      - '*'
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
      - 'boards/**'
  pull_request:
    paths:
      - 'src/**.cpp'
      - 'src/**.hpp'
      - 'src/**.h'
      - 'src/**.c'
      - 'examples/UnitUnified/**.ino'
      - 'examples/UnitUnified/**.cpp'
      - 'examples/UnitUnified/**.hpp'
      - 'examples/UnitUnified/**.h'
      - 'examples/UnitUnified/**.c'
      - '.github/workflows/platformio-build-check.yml'
      - 'platformio.ini'
      - 'boards/**'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.unit }}:${{ matrix.example }}@${{ matrix.board }}:${{ matrix.framework }}:${{ matrix.espressif32 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12

    strategy:
      fail-fast: false
      max-parallel: 20
      
      matrix:
        # Every unit uses its own transport and wiring helper (UnitDLight: addI2C, UnitLight: addGPIO),
        # so the unit axis is not reduced (see skill m5-build-ci-matrix)
        unit:
          - UnitDLight
          - UnitLight

        example:
          - PlotToSerial
          # The hub examples go through UnitPaHub / UnitPbHub (M5Unit-HUB), so they are built on every representative board
          - ViaPaHub
          - ViaPbHub

        board:
          # Reduced from 19 to 5 boards: one per compile config (chip arch x platform).
          # The other boards differ only in the variant header, so the library code compiles the same.
          - Core
#          - Core2  # ESP32: represented by Core
          - CoreS3
#          - Fire  # ESP32: represented by Core
#          - StampS3  # ESP32-S3: represented by CoreS3
#          - Dial  # ESP32-S3: represented by CoreS3
#          - Atom  # ESP32: represented by Core
#          - AtomS3  # ESP32-S3: represented by CoreS3
#          - AtomS3R  # ESP32-S3: represented by CoreS3
          - NanoC6
          - NanoH2
#          - StickCPlus  # ESP32: represented by Core
#          - StickCPlus2  # ESP32: represented by Core
#          - StickS3  # ESP32-S3: represented by CoreS3
#          - Paper  # ESP32: represented by Core
#          - CoreInk  # ESP32: represented by Core
#          - Cardputer  # ESP32-S3: represented by CoreS3
          - Tab5
#          - NessoN1  # ESP32-C6: represented by NanoC6

        framework:
          - Arduino

        espressif32:
          - latest

        # ViaPaHub is for the I2C unit (UnitDLight) only, ViaPbHub for the GPIO unit (UnitLight) only
        exclude:
          - {unit: UnitLight, example: ViaPaHub}
          - {unit: UnitDLight, example: ViaPbHub}

        include:
          # HatDLight (Hat-supported boards only)
#         # ESP32 Hat port: represented by StickCPlus2
#         - example: PlotToSerial
#           unit: HatDLight
#           board: StickCPlus
#           framework: Arduino
#           espressif32: latest
          - example: PlotToSerial
            unit: HatDLight
            board: StickCPlus2
            framework: Arduino
            espressif32: latest
          - example: PlotToSerial
            unit: HatDLight
            board: StickS3
            framework: Arduino
            espressif32: latest
#         # ESP32 Hat port: represented by StickCPlus2
#         - example: PlotToSerial
#           unit: HatDLight
#           board: CoreInk
#           framework: Arduino
#           espressif32: latest
          - example: PlotToSerial
            unit: HatDLight
            board: NessoN1
            framework: Arduino
            espressif32: latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install intelhex
        run: pip install intelhex

      - name: Build examples
        uses: karniv00l/platformio-run-action@v1
        with:
          environments: ${{ matrix.unit != '' && format('{0}_{1}_{2}_{3}_{4}', matrix.unit, matrix.example, matrix.board, matrix.framework, matrix.espressif32) || format('{0}_{1}_{2}_{3}', matrix.example, matrix.board, matrix.framework, matrix.espressif32) }}
#         targets:
          project-dir: "./"
          project-conf: "./platformio.ini"
#          jobs: 6
#          silent: false
#          verbose: true
#          disable-auto-clean: false
